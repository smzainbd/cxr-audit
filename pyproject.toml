[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cxr-audit"
version = "0.1.0"
description = "Production multi-architecture chest X-ray explainability, faithfulness, and dynamic failure-mode policy gating."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "S M Zain", email = "smzainbd@gmail.com" },
]
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",
    "peft>=0.6.2",
    "captum>=0.7.0",
    "grad-cam>=1.5.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "pandas>=2.1.0",
    "opencv-python-headless>=4.8.0",
    "huggingface-hub>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "gradio>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cxr_audit"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
